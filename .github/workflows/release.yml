name: Release

# Changesets 自动发版，无需手动触发：
#
# 1. main 上存在待发布 changeset 时，自动开/更新 "Version Packages" PR
#    （跑 changeset version，携带版本号与 CHANGELOG 变更）；
# 2. 该 PR 合并回 main 后本 workflow 再次触发，此时没有待发布 changeset，
#    走 publish 分支：typecheck / test / build → pnpm publish 到 npm，
#    随后由 changesets 打 `@solid-fluent/components@x.y.z` 标签并创建 GitHub Release。
#
# 普通 push（无 changeset）只会命中步骤 1 的空跑，不会发布。

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  # changesets/action 创建 Version Packages PR 需要 pull-requests: write；
  # 只有 contents: write 能推分支但开不了 PR（Resource not accessible by integration）。
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages / publish on demand
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          version: pnpm exec changeset version
          # 仅在合并 Version Packages PR 后（无待发布 changeset）执行：
          # 发布前再跑一遍门禁与构建，任何一步失败都不会推到 npm。
          publish: |
            pnpm typecheck
            pnpm test
            pnpm build
            pnpm publish --access public --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
